<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estellar Academy | Best JEE NEET Coaching in Goa</title>
    <!-- Google Fonts -->

    <style>
        :root {
            --primary: #0f2c59;       /* Deep Navy Blue */
            --primary-light: #1d4ed8;
            --accent: #f59e0b;        /* Warm Gold/Amber */
            --accent-hover: #d97706;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-padding {
            padding: 80px 0;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 50px;
        }

        .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-hover);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-header h2 {
            font-size: 2.3rem;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn-accent {
            background: var(--accent);
            color: var(--white);
        }

        .btn-accent:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
        }

        /* ================= TOP BAR & NAVBAR ================= */
        .top-bar {
            background: var(--primary);
            color: var(--white);
            font-size: 0.85rem;
            padding: 8px 0;
        }

        .top-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar-info span {
            margin-right: 20px;
        }

        .top-bar-info i {
            color: var(--accent);
            margin-right: 6px;
        }

        header {
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: var(--accent);
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-links a {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text-dark);
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent-hover);
        }

        .nav-actions {
            display: flex;
            gap: 10px;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
        }

        /* ================= HERO SECTION ================= */
        .hero {
            background: linear-gradient(135deg, #091d3e 0%, #0f2c59 60%, #1e3a8a 100%);
            color: var(--white);
            padding: 90px 0 70px;
            position: relative;
            overflow: hidden;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 1.12rem;
            color: #cbd5e1;
            margin-bottom: 30px;
            max-width: 580px;
        }

        .hero-btns {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hero-tags span {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .hero-card {
            background: var(--white);
            color: var(--text-dark);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .hero-card h3 {
            color: var(--primary);
            margin-bottom: 6px;
            font-size: 1.35rem;
        }

        .hero-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }

        /* ================= EXPLORE OUR ACADEMY ================= */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .highlight-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }

        .highlight-card:hover {
            transform: translateY(-6px);
        }

        .highlight-img {
            height: 180px;
            background: linear-gradient(45deg, var(--primary), #2563eb);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .highlight-img i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .highlight-body {
            padding: 20px;
        }

        .highlight-body h3 {
            font-size: 1.05rem;
            color: var(--primary);
            line-height: 1.4;
        }

        /* ================= PROGRAMS SECTION ================= */
        .programs-sec {
            background: var(--bg-light);
        }

        .esip-banner {
            background: linear-gradient(135deg, var(--primary), #1e3a8a);
            color: var(--white);
            border-radius: 18px;
            padding: 40px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .esip-content {
            max-width: 720px;
        }

        .esip-content .tag {
            background: var(--accent);
            color: var(--primary);
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
